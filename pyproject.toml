# Workspace root: dev/test tooling only, not a published package.
[project]
name = "tapo-homeassistant-workspace"
version = "0.0.0"
description = "uv workspace root for the Tapo/TP-Link Home Assistant integration"
requires-python = ">=3.14"  # pytest-homeassistant-custom-component requires >=3.14
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "mypy",
    "ruff",
    "tapolink-proto",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tapolink-proto = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/tapolink-proto/tests"]

[tool.mypy]
python_version = "3.14"
strict = true
# custom_components/ is a namespace package (no __init__.py by design, see
# tests/conftest.py); resolve modules from the repo root so relative imports work.
explicit_package_bases = true
# Phase 0 spike is excluded for the same reason as in [tool.ruff]: one-off
# validation script, optional GPL oracle import, not product code.
exclude = ["^tools/spike_cloud_discovery\\.py$"]
# pytest (rootdir conftest, no tests/__init__.py) puts tests/tapo_onboard on
# sys.path, so the tests import their helpers by bare name; mirror that here.
mypy_path = "tests/tapo_onboard"

[[tool.mypy.overrides]]
# The HA test harness ships no py.typed marker; treat it as untyped.
module = ["pytest_homeassistant_custom_component", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
# Phase 0 validation spike: a standalone one-off script kept verbatim for
# reproducibility (docs/RESEARCH.md §11); not product code.
extend-exclude = ["tools/spike_cloud_discovery.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
