[project]
name = "tapolink-proto"
version = "0.1.0"
description = "Clean-room Tapo/TP-Link local protocol client"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "aiohttp",
    "cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapolink_proto"]  # src layout; py.typed ships inside the package
